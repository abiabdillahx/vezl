name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Multi-arch image -> ghcr.io/<owner>/<repo>. PRs only build (as a check).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Static binaries + systemd files attached to a GitHub Release, for running without Docker.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -rf ../server/internal/static/dist
          cp -r dist ../server/internal/static/dist

      - name: Build binaries
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            name="vezl_${GITHUB_REF_NAME}_linux_${arch}"
            mkdir -p "out/$name"
            (cd server && CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" -o "../out/$name/vezl" ./cmd/vezl)
            cp deploy/vezl.service deploy/vezl.env.example "out/$name/"
            tar -C out -czf "out/$name.tar.gz" "$name"
          done
          (cd out && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/SHA256SUMS --verify-tag --generate-notes
