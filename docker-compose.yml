services:
  vezl:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_PATH: /data/vezl.db
      SESSION_SECRET: change-me-min-32-chars-please
      ADMIN_EMAIL: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      GIN_MODE: release
      # Soft heap cap so the Go GC stays frugal on small VPSes.
      GOMEMLIMIT: 100MiB
    volumes:
      - vezl-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  vezl-data:
